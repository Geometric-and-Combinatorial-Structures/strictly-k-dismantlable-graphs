name: Reproduce the mathematical calculations
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mathematics:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.12', '3.13']
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Reproduce the required and extended calculations
        run: python reproduce.py --extended
      - name: Boundary and rejection tests
        run: python -B -m unittest discover -s tests -v
      - name: Run every notebook cell in a fresh process
        run: python tests/run_notebook.py
      - name: Preserve the calculation reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: calculations-${{ matrix.os }}-${{ matrix.python }}
          path: results/
